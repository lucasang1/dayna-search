<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dayna's search tool</title>
    <style>
        :root { --primary: #ff8fa3; --bg: #fff0f3; --text: #590d22; --warning: #ffb703; --secondary: #ffccd5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 700px; }
        h1 { margin-top: 0; color: var(--primary); font-size: 26px; text-align: center; letter-spacing: -0.5px; }
        
        /* CONTROLS AREA */
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .row { display: flex; gap: 10px; align-items: center; justify-content: center; }
        .label-text { font-size: 14px; font-weight: 600; color: #888; min-width: 100px; text-align: right; }

        /* SWITCHER STYLES */
        .mode-switch { display: flex; background: #eee; padding: 4px; border-radius: 12px; flex: 1; }
        .mode-btn { 
            flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; 
            cursor: pointer; font-weight: 600; color: #666; transition: 0.2s; font-size: 13px;
        }
        .mode-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .date-badge { background: #fff; border: 1px solid #ffccd5; padding: 8px 15px; border-radius: 8px; font-size: 13px; color: #d63384; text-align: center; font-weight: 500; width: 100%; box-sizing: border-box;}
        
        .input-group { display: flex; gap: 10px; margin-top: 10px; }
        input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        
        button.search-btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.search-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* RESULTS STYLING */
        .section-header { margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; display: flex; align-items: center; gap: 8px;}
        .batch-btn { 
            display: block; background: #fff; border: 2px solid var(--primary); color: var(--primary); 
            padding: 12px; text-align: center; border-radius: 12px; text-decoration: none; margin-top: 10px; 
            transition: 0.2s; font-weight: 600; 
        }
        .batch-btn:hover { background: var(--primary); color: white; }
        
        /* GRID FOR INDIVIDUAL SITES */
        .direct-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        .direct-btn { 
            background: #fff; border: 1px solid #ddd; color: #555; padding: 8px; 
            text-align: center; border-radius: 8px; text-decoration: none; font-size: 11px; transition: 0.2s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;
        }
        .direct-btn:hover { border-color: var(--primary); color: var(--primary); background: #fff0f3; }

        .manual-note { font-size: 12px; background: #fffbe6; padding: 8px; border-radius: 6px; margin-bottom: 15px; color: #856404; border: 1px solid #ffeeba;}
    </style>
</head>
<body>

<div class="container">
    <h1>dayna's search tool!</h1>
    
    <div class="controls">
        <div class="row">
            <span class="label-text">Range:</span>
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-weekly" onclick="setMode('weekly')">weekly</button>
                <button class="mode-btn" id="btn-monthly" onclick="setMode('monthly')">monthly</button>
            </div>
        </div>

        <div class="row">
            <span class="label-text">Style:</span>
            <div class="mode-switch">
                <button class="mode-btn active" id="btn-batch" onclick="setStyle('batch')">Google Batches</button>
                <button class="mode-btn" id="btn-individual" onclick="setStyle('individual')">Individual Sites</button>
            </div>
        </div>

        <div class="date-badge" id="dateDisplay">calculating dates...</div>

        <div class="input-group">
            <input type="text" id="keyword" placeholder="e.g. onitsuka..." onkeydown="if(event.key==='Enter') runSearch()">
            <button class="search-btn" onclick="runSearch()">Search</button>
        </div>
    </div>

    <div id="resultsArea"></div>
</div>

<script>
    // Problem Sites (Pre-mapped)
    const PROBLEM_SITES = [
        { name: "Esquire SG", url: "https://esquiresg.com/?s=" },
        { name: "Her World", url: "https://www.herworld.com/search?sort=latest&q=" },
        { name: "Harpers Bazaar", url: "https://www.harpersbazaar.com.sg/search?sort=latest&q=" },
        { name: "Icon Singapore", url: "https://www.iconsingapore.com/search?sort=latest&q=" },
        { name: "NuYou", url: "https://www.nuyou.com.sg/search?sort=latest&q=" },
        { name: "Lifestyle Asia", url: "https://www.lifestyleasia.com/sg/?category_name=&orderby=date&order=desc&s=" }
    ];

    /* TRUSTED SITES MAPPING 
       type: 's' = /?s= (Standard WordPress/Blog)
       type: 'q' = /search?q= (Standard News)
       custom: Full URL string
    */
    const TRUSTED_SITES = [
        { name: "8 Days", url: "8days.sg", type: 'q', full: "https://www.8days.sg/search?q=" },
        { name: "8 World", url: "8world.com", type: 'q', full: "https://www.8world.com/search?q=" },
        { name: "AsiaOne", url: "asiaone.com", type: 'custom', full: "https://www.asiaone.com/search?q=" },
        { name: "August Man", url: "augustman.com/sg", type: 's' },
        { name: "Avenue One", url: "avenueone.sg", type: 's' },
        { name: "Bagaholicboy", url: "bagaholicboy.com", type: 'q' },
        { name: "Beauty Insider", url: "beautyinsider.sg", type: 's' },
        { name: "Business Insider", url: "businessinsider.com", type: 'q', full: "https://www.businessinsider.com/s?q=" },
        { name: "CNA", url: "channelnewsasia.com", type: 'custom', full: "https://www.channelnewsasia.com/search?q=" },
        { name: "City Nomads", url: "citynomads.com", type: 's' },
        { name: "CNA Luxury", url: "cnaluxury.channelnewsasia.com", type: 'custom', full: "https://cnaluxury.channelnewsasia.com/search?q=" },
        { name: "Curatedition", url: "curatedition.com", type: 's' },
        { name: "Daniel Food Diary", url: "danielfooddiary.com", type: 's' },
        { name: "Daily Vanity", url: "dailyvanity.sg", type: 's' },
        { name: "The DC Edit", url: "thedcedit.com", type: 's' },
        { name: "DFNI Online", url: "dfnionline.com", type: 's' },
        { name: "Elle SG", url: "elle.com.sg", type: 's' },
        { name: "Expat Living", url: "expatliving.sg", type: 's' },
        { name: "Female Mag (Fzine)", url: "fzine.com", type: 'q' },
        { name: "GirlStyle", url: "girlstyle.com/sg", type: 'custom', full: "https://girlstyle.com/sg/search?q=" },
        { name: "Grazia", url: "grazia.sg", type: 's' },
        { name: "Home & Decor", url: "homeanddecor.com.sg", type: 's' },
        { name: "Honeycombers", url: "thehoneycombers.com/singapore", type: 's' },
        { name: "Inside Retail", url: "insideretail.asia", type: 's' },
        { name: "L'Officiel", url: "lofficielsingapore.com", type: 's' },
        { name: "Zaobao", url: "zaobao.com.sg", type: 'custom', full: "https://www.zaobao.com.sg/search?q=" },
        { name: "Lifestyle Coll.", url: "lifestylecollective.org", type: 's' },
        { name: "Luxuo", url: "luxuo.com", type: 's' },
        { name: "Marketing Int.", url: "marketing-interactive.com", type: 's' },
        { name: "Men's Folio", url: "mens-folio.com", type: 's' },
        { name: "Monocle", url: "monocle.com", type: 'custom', full: "https://monocle.com/search/?q=" },
        { name: "Muse SG", url: "musesingapore.com", type: 's' },
        { name: "Nylon SG", url: "nylon.com.sg", type: 's' },
        { name: "Observatory", url: "observatory.sg", type: 's' },
        { name: "Pin Prestige", url: "pinprestige.com/sg", type: 's' },
        { name: "Prestige Online", url: "prestigeonline.com/sg", type: 's' },
        { name: "Robb Report", url: "robbreport.com.sg", type: 's' },
        { name: "Senatus", url: "senatus.net", type: 'custom', full: "https://senatus.net/search/?q=" },
        { name: "Seth Lui", url: "sethlui.com", type: 's' },
        { name: "SG Magazine", url: "sgmagazine.com", type: 's' },
        { name: "Shin Min", url: "shinmin.sg", type: 'custom', full: "https://www.shinmin.sg/search?q=" },
        { name: "SilverKris", url: "silverkris.com", type: 's' },
        { name: "Tatler Asia", url: "tatlerasia.com", type: 'custom', full: "https://www.tatlerasia.com/search?q=" },
        { name: "SCMP", url: "scmp.com", type: 'custom', full: "https://www.scmp.com/search/" },
        { name: "SuperAdrianMe", url: "superadrianme.com", type: 's' },
        { name: "The Beau Life", url: "thebeaulife.co", type: 's' },
        { name: "Business Times", url: "businesstimes.com.sg", type: 'custom', full: "https://www.businesstimes.com.sg/search?q=" },
        { name: "The Edge", url: "theedgesingapore.com", type: 'custom', full: "https://www.theedgesingapore.com/search?q=" },
        { name: "TNP", url: "tnp.sg", type: 'custom', full: "https://tnp.straitstimes.com/search?searchkey=" },
        { name: "The Peak", url: "thepeakmagazine.com.sg", type: 's' },
        { name: "Women's Weekly", url: "womensweekly.com.sg", type: 's' },
        { name: "The Smart Local", url: "thesmartlocal.com", type: 's' },
        { name: "Straits Times", url: "straitstimes.com", type: 'custom', full: "https://www.straitstimes.com/search?searchkey=" },
        { name: "Time Out", url: "timeout.com/singapore", type: 'custom', full: "https://www.timeout.com/singapore/search?q=" },
        { name: "Today Online", url: "todayonline.com/singapore", type: 'custom', full: "https://www.todayonline.com/search?q=" },
        { name: "MeWatch", url: "mewatch.sg", type: 'custom', full: "https://www.mewatch.sg/search?q=" },
        { name: "Vanilla Luxury", url: "Vanillaluxury.sg", type: 's' },
        { name: "Vogue SG", url: "vogue.sg", type: 's' },
        { name: "Vulcan Post", url: "vulcanpost.com", type: 's' },
        { name: "Weekender", url: "weekender.com.sg", type: 's' },
        { name: "Yahoo SG", url: "sg.yahoo.com", type: 'custom', full: "https://sg.search.yahoo.com/search?p=" },
        { name: "Zula", url: "zula.sg", type: 's' }
    ];

    let currentMode = 'weekly'; 
    let currentStyle = 'batch'; 

    function getDates() {
        const today = new Date();
        const fmt = d => d.toLocaleDateString('en-GB');
        if (currentMode === 'weekly') {
            const dayOfWeek = today.getDay(); 
            let daysToMon = dayOfWeek === 1 ? 0 : (dayOfWeek + 6) % 7; 
            const endDate = new Date(today);
            endDate.setDate(today.getDate() - daysToMon);
            const startDate = new Date(endDate);
            startDate.setDate(endDate.getDate() - 6);
            return { label: `Weekly: ${fmt(startDate)} - ${fmt(endDate)}`, tbs: 'qdr:w' };
        } else {
            const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            const endOfPrevMonth = new Date(firstOfThisMonth);
            endOfPrevMonth.setDate(firstOfThisMonth.getDate() - 1);
            const startOfPrevMonth = new Date(endOfPrevMonth.getFullYear(), endOfPrevMonth.getMonth(), 1);
            const gFmt = d => `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
            return { label: `Monthly: ${fmt(startOfPrevMonth)} - ${fmt(endOfPrevMonth)}`, tbs: `cdr:1,cd_min:${gFmt(startOfPrevMonth)},cd_max:${gFmt(endOfPrevMonth)}` };
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-weekly').classList.toggle('active', mode === 'weekly');
        document.getElementById('btn-monthly').classList.toggle('active', mode === 'monthly');
        updateLabel();
    }

    function setStyle(style) {
        currentStyle = style;
        document.getElementById('btn-batch').classList.toggle('active', style === 'batch');
        document.getElementById('btn-individual').classList.toggle('active', style === 'individual');
    }

    function updateLabel() {
        document.getElementById('dateDisplay').innerText = getDates().label;
    }

    updateLabel();

    function getDirectSearchUrl(site, query) {
        const encQuery = encodeURIComponent(query);
        if (site.full) {
            return `${site.full}${encQuery}`;
        }
        if (site.type === 'q') {
            return `https://www.${site.url}/search?q=${encQuery}`;
        }
        // Default to 's' (WordPress style)
        return `https://${site.url}/?s=${encQuery}`;
    }

    function runSearch() {
        const query = document.getElementById('keyword').value;
        const resultsArea = document.getElementById('resultsArea');
        if (!query) { alert("Enter a keyword first!"); return; }

        const dateInfo = getDates();
        let html = ``;

        if (currentStyle === 'batch') {
            // BATCH LOGIC
            html += `<div class="section-header">✨ Google Batches</div>`;
            const chunkSize = 15;
            for (let i = 0; i < TRUSTED_SITES.length; i += chunkSize) {
                const chunk = TRUSTED_SITES.slice(i, i + chunkSize);
                // Extract URL from the object for the query string
                const siteString = chunk.map(s => `site:${s.url}`).join(' OR ');
                const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(`(${siteString}) "${query}"`)}&tbs=${dateInfo.tbs}`; 
                html += `<a href="${searchUrl}" target="_blank" class="batch-btn">Open Batch ${Math.floor(i/chunkSize) + 1} <span style="font-size:11px; font-weight:normal; display:block;">(Sites ${i+1}-${Math.min(i+chunkSize, TRUSTED_SITES.length)})</span></a>`;
            }
            html += `<div class="section-header" style="margin-top:30px;">⚠️ Internal Search (Problem Sites)</div>`;
            html += `<div class="direct-grid">`;
            PROBLEM_SITES.forEach(site => {
                html += `<a href="${site.url}${encodeURIComponent(query)}" target="_blank" class="direct-btn">${site.name} ↗</a>`;
            });
            html += `</div>`;
        } else {
            // INDIVIDUAL (DIRECT) LOGIC
            html += `<div class="section-header">🔍 Direct Site Search (71 Sites)</div>`;
            html += `<div class="manual-note"><b>Note:</b> These buttons search the website directly. <u>The date range filter above will NOT apply</u> to these results.</div>`;
            html += `<div class="direct-grid">`;
            
            // 1. Trusted Sites (Now using Direct Internal Search)
            TRUSTED_SITES.forEach(site => {
                const searchUrl = getDirectSearchUrl(site, query);
                html += `<a href="${searchUrl}" target="_blank" class="direct-btn">${site.name}</a>`;
            });
            
            // 2. Problematic Sites via Internal
            PROBLEM_SITES.forEach(site => {
                html += `<a href="${site.url}${encodeURIComponent(query)}" target="_blank" class="direct-btn" style="border-color: #ffb703;">${site.name}*</a>`;
            });
            html += `</div>`;
        }

        resultsArea.innerHTML = html;
    }
</script>

</body>
</html>
